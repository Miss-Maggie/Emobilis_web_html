<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
<h1>Item lists</h1>
<a href="{% url 'item_create' %}"></a>

<ul>
    {% for item in items %}

        <li>
        {{ item.name }} - {{ item.price }}
        <a href="{% url 'item_update' item.id %}">Update</a>
        <a href="{% url 'item_delete' item.id %}">Delete</a>
        </li>

    {% endfor %}
</ul>
</body>
</html>
