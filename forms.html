<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Static\css\formstyle.css">
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>
<div class="form-box">
    <form action="">
        <h2>Create an account</h2>
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your name..">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Your last name..">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your Email..">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password..">
        <label for="confirm-password">Confirm Password</label>
        <input type="confirm-password" id="confirm-password" name="confirm-password" placeholder="Confirm Password..">
        <label for="dob"> Date of Birth</label>
        <input type="date" id="dob" name="dob" placeholder="Date of Birth..">
        <label for ="gender">Male</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Female</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Other</label>
        <input type="radio" id="other" name="gender" value="other" required>


        <label for="course"> Course selected</label>
        <select id="course" name="course">
            <option selected>Choose...</option>
            <option>Javascript</option>
            <option>CSS</option>
            <option>React</option>
            <option>Laravel</option>
            <option>Python</option>
            <option>PHP</option>
        </select>

        <label for ="Choose File">Upload</label>
        <input type="file" id="Choose File" name="Choose File">
    </form>
    <button type="submit">Submit</button>
</div>

</body>
</html>
