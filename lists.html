<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS</title>
</head>
<body>
<h2>Lists of cars</h2>
<h2>Ordered Lists</h2>
<ol>
    <li>Nissan</li>
    <li>Mercedes</li>
    <li>Honda</li>
    <li>Toyota</li>
    <li>Subaru</li>
</ol>

<h2>List of fruits</h2>
<h2>Unordered Lists</h2>
<ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
    <li>Strawberry</li>
    <li>Pawpaw</li>
</ul>
</body>
</html>
